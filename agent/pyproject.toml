[project]
name = "travember-agent"
version = "0.1.0"
description = "Travember's itinerary planner: a LangGraph ReAct agent on Gemini, with travel tools served over MCP"
requires-python = ">=3.12"
dependencies = [
    "google-genai==2.31.0",
    "langgraph==1.2.15",
    "mcp==2.3.0",
    "fastapi==0.143.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.15.1",
    "jsonschema==4.26.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
